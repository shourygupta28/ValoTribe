services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: valotribe
      POSTGRES_PASSWORD: valotribe
      POSTGRES_DB: valotribe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - valotribe-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valotribe"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  valotribe-db:
